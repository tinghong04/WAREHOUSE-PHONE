<div class="flash" id="flash"></div>
<div class="wrap">
  <div class="card header">
    <button class="langbtn" id="langBtn" onclick="toggleLang()">EN</button>
    <h1 data-i18n="title">📦 仓库 SKU 扫码计数器</h1>
    <div class="muted" data-i18n="subtitle">二维码 + 一维码 + 手动输入 · 自动统计 · 导出 Excel</div>
  </div>

  <div class="card">
    <div class="grid">
      <div><label data-i18n="employee">员工姓名</label><input id="employeeName" data-ph="employeePh" placeholder="例如：Ah Hong"></div>
      <div><label data-i18n="date">日期</label><input id="taskDate" type="date" disabled></div>
      <div><label data-i18n="taskName">任务名称</label><input id="taskName" data-ph="taskNamePh" placeholder="例如：退货盘点"></div>
    </div>
  </div>

  <div class="syncbar"><div><b id="syncTitle">☁️ 云端同步</b><br><span id="syncStatus">准备中…</span></div><button id="retryBtn" class="dark" style="padding:9px 12px;display:none" onclick="retryPending()">重试</button></div>

  <div class="card photo-option">
    <div><b data-i18n="photoMode">每单拍照</b><div class="muted" data-i18n="photoModeHint">开启后，扫码即以条码为单号拍一张照片</div></div>
    <label class="switch" aria-label="每单拍照"><input id="photoMode" type="checkbox"><span class="slider"></span></label>
  </div>
  <div id="photoStatus" class="photo-status"></div>

  <div class="card camera-card">
    <div class="camera-wrap">
      <div id="reader"></div>
      <div class="scan-overlay">
        <div class="scan-box">
          <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
        </div>
      </div>
    </div>
    <div class="camera-status">
      <span id="camStatus">正在启动摄像头…</span>
      <button id="restartBtn" class="dark" onclick="restartCamera()">重新启动摄像头</button>
    </div>
  </div>

  <div class="muted" style="margin:-4px 8px 12px;text-align:center" data-i18n="scanHint">
    白色正方形只是瞄准参考；实际会识别整张相机画面，远一点也能尝试识别。
  </div>

  <div class="card">
    <label data-i18n="manualLabel">手动输入 SKU / 条码内容</label>
    <div class="manual">
      <input id="manualInput" data-ph="manualPh" placeholder="输入 SKU / 条码">
      <button id="manualAddBtn" onclick="manualAdd()" data-i18n="manualAddBtn">+1</button>
    </div>
    <div class="muted" style="margin-top:8px" data-i18n="manualHint">手动输入和摄像头扫码都每次 +1；数量可在下方 SKU 明细直接修改。</div>
  </div>

  <div class="card">
    <div class="muted" data-i18n="lastEntry">刚刚录入</div>
    <div class="last" id="lastCode">等待扫描或输入…</div>
    <div class="qty" id="lastQty">当前数量：0</div>
  </div>

  <div class="stats">
    <div class="stat"><span data-i18n="total">总数量</span><b id="totalCount">0</b></div>
    <div class="stat"><span data-i18n="unique">SKU 种类</span><b id="uniqueCount">0</b></div>
  </div>

  <div class="card">
    <div class="actions">
      <button onclick="undoLast()" data-i18n="undo">撤销上一次</button>
      <button class="dark" onclick="exportExcel()" data-i18n="excel">生成 Excel</button>
      <button class="dark" onclick="copyCurrentTask()" data-i18n="copy">复制明细</button>
      <button id="finishBtn" class="red full" onclick="newTask()" data-i18n="newTask">完成并开始新任务</button>
    </div>
  </div>

  <div class="card">
    <b data-i18n="details">SKU 明细</b>
    <input id="searchInput" class="search" data-ph="searchPh" placeholder="搜索 SKU" oninput="render()">
    <div id="skuList" style="margin-top:8px"></div>
  </div>
</div>

function unlockAudio(){
 try{
   if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
   if(audioCtx.state==="suspended")audioCtx.resume();
 }catch(e){}
}
["touchstart","pointerdown","click"].forEach(evt=>document.addEventListener(evt,unlockAudio,{passive:true}));

function beep(){
 try{
   unlockAudio();
   if(!audioCtx || audioCtx.state!=="running")return;
   const now=audioCtx.currentTime;
   const o=audioCtx.createOscillator(),g=audioCtx.createGain();
   o.type="square";o.frequency.setValueAtTime(1350,now);
   g.gain.setValueAtTime(0.0001,now);
   g.gain.exponentialRampToValueAtTime(0.34,now+0.005);
   g.gain.exponentialRampToValueAtTime(0.0001,now+0.14);
   o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+0.15);
 }catch(e){}
}
function feedback(){
 beep();
 // iPhone Safari does not support navigator.vibrate; Android/compatible browsers will vibrate.
 try{if(navigator.vibrate)navigator.vibrate(80)}catch(e){}
 requestAnimationFrame(()=>{
   flash.classList.add("on");
   setTimeout(()=>requestAnimationFrame(()=>flash.classList.remove("on")),120);
 });
}

function add(code,qty=1){
 code=(code||"").trim();qty=Math.max(1,parseInt(qty,10)||1);if(!code)return;
 counts[code]=(counts[code]||0)+qty;
 for(let i=0;i<qty;i++)history.push(code);
 lastCode.textContent=code;lastQty.textContent=t("currentQty")+counts[code];
 feedback();scheduleRender();
}
function manualAdd(){

];

async function onScan(code){
 const now=Date.now();
 if(scanProcessing)return;
 if(code===lastDecoded && now-lastAt<2000)return;
 scanProcessing=true;lastDecoded=code;
 const withPhoto=photoMode.checked;
 try{
   try{if(html5QrCode&&cameraRunning)html5QrCode.pause(false)}catch(e){}
   if(withPhoto){updatePhotoStatus("hold");await new Promise(r=>setTimeout(r,900))}
   else await new Promise(r=>setTimeout(r,220));
   add(code);
   if(withPhoto)await captureOrderPhoto(code);
 }finally{
   lastAt=Date.now();
   await new Promise(r=>setTimeout(r,withPhoto?700:450));
   try{if(html5QrCode&&cameraRunning)html5QrCode.resume()}catch(e){}
   scanProcessing=false;
 }
}

async function enhanceCamera(){
 try{
   const video=document.querySelector("#reader video");
   if(!video || !video.srcObject)return;
   currentTrack=video.srcObject.getVideoTracks()[0];
   const caps=currentTrack.getCapabilities?currentTrack.getCapabilities():{};
   const advanced={};
   if(caps.focusMode && caps.focusMode.includes("continuous"))advanced.focusMode="continuous";
   if(caps.zoom && typeof caps.zoom.min==="number" && typeof caps.zoom.max==="number"){
      const target=Math.min(caps.zoom.max, Math.max(caps.zoom.min, 1.35));
      if(target>caps.zoom.min)advanced.zoom=target;
   }
   if(Object.keys(advanced).length){
      await currentTrack.applyConstraints({advanced:[advanced]});
   }
 }catch(e){}
}

async function startCamera(){
 restartBtn.style.display="none";camStatus.textContent=t("camStarting");
 try{
   if(!html5QrCode)html5QrCode=new Html5Qrcode("reader",{formatsToSupport:formats,verbose:false});
   await html5QrCode.start(
     {facingMode:"environment"},
     {
       fps:8,
       qrbox:(viewfinderWidth,viewfinderHeight)=>{const size=Math.floor(Math.min(viewfinderWidth,viewfinderHeight)*.46);return {width:size,height:size}},
       aspectRatio:1.333333,
       videoConstraints:{
         facingMode:{ideal:"environment"},
         width:{ideal:1920},
         height:{ideal:1080}
       }
       // Scan only within the centered square region.
     },
     onScan,
     ()=>{}
   );
   cameraRunning=true;
   camStatus.textContent=t("camReady");
   setTimeout(enhanceCamera,500);
 }catch(err){
   cameraRunning=false;camStatus.textContent=t("camError");restartBtn.style.display="inline-block";
 }
}
async function restartCamera(){
 try{
   if(html5QrCode && cameraRunning){await html5QrCode.stop()}
 }catch(e){}
 cameraRunning=false;
 try{if(html5QrCode)await html5QrCode.clear()}catch(e){}
 html5QrCode=null;
 await new Promise(r=>setTimeout(r,250));
 startCamera();
}

async function ensurePhotoUser(){
 if(photoUserId)return photoUserId;

 if(current.data.user){photoUserId=current.data.user.id;return photoUserId}
 const signed=await photoSb.auth.signInAnonymously();

function captureOrderPhoto(orderNo){
 photoUploadCount++;updatePhotoStatus("taking");
 return new Promise(resolve=>{
   const video=document.querySelector("#reader video");
   if(!video||!video.videoWidth){photoUploadCount--;updatePhotoStatus("error");resolve(false);return}
   const max=1080,scale=Math.min(1,max/Math.max(video.videoWidth,video.videoHeight));
   const canvas=document.createElement("canvas");canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);
   canvas.getContext("2d").drawImage(video,0,0,canvas.width,canvas.height);
   canvas.toBlob(async blob=>{
     let saved=false;
     try{
       if(!blob)throw new Error("No photo data");
       const userId=await ensurePhotoUser();
       const fileName=`${Date.now()}_${safeName(orderNo)}.jpg`;
       const path=`${userId}/${currentTaskId}/${fileName}`;
       const uploaded=await photoSb.storage.from("task-order-photos").upload(path,blob,{contentType:"image/jpeg",cacheControl:"31536000",upsert:false});
       if(uploaded.error)throw uploaded.error;
       orderPhotos.push({order_no:orderNo,storage_path:path,captured_at:new Date().toISOString()});
       localStorage.setItem("warehouse_current_task_photos",JSON.stringify(orderPhotos));
       updatePhotoStatus();saved=true;
     }catch(e){console.error(e);updatePhotoStatus("error")}
     finally{photoUploadCount--;resolve(saved)}
   }, "image/jpeg", .86);
 });
}

function undoLast(){
 const c=history.pop();if(!c)return;
 counts[c]--;if(counts[c]<=0)delete counts[c];
 lastCode.textContent=t("undone")+c;lastQty.textContent=t("currentQty")+(counts[c]||0);scheduleRender();
}
function changeQty(sku,delta){
 if(!counts[sku])return;counts[sku]+=delta;
 if(counts[sku]<=0)delete counts[sku];
 if(delta>0)history.push(sku);else{const idx=history.lastIndexOf(sku);if(idx>=0)history.splice(idx,1)}
 lastCode.textContent=sku;lastQty.textContent=t("currentQty")+(counts[sku]||0);scheduleRender();
}
function setQty(sku,value){
 const old=counts[sku]||0;
 const next=Math.max(0,parseInt(value,10)||0);
 if(next===old){scheduleRender();return}
 if(next<=0){
   delete counts[sku];
   history=history.filter(x=>x!==sku);
 }else{
   counts[sku]=next;
   const diff=next-old;
   if(diff>0){
     for(let i=0;i<diff;i++)history.push(sku);
   }else{
     let remove=-diff;
     for(let i=history.length-1;i>=0&&remove>0;i--){
       if(history[i]===sku){history.splice(i,1);remove--}
     }
   }
 }
 lastCode.textContent=sku;lastQty.textContent=t("currentQty")+(counts[sku]||0);scheduleRender();
}
let renderQueued=false;
function scheduleRender(){
 if(renderQueued)return;
 renderQueued=true;
 requestAnimationFrame(()=>{renderQueued=false;render()});
}

 if(term)es=es.filter(([s])=>s.toLowerCase().includes(term));

 if(!es.length){skuList.innerHTML='<div class="muted">'+t("noData")+'</div>';return}
 es.forEach(([s,q])=>{
   const d=document.createElement("div");d.className="row";
   const a=document.createElement("div");a.textContent=s;
   const minus=document.createElement("button");minus.className="mini";minus.textContent="-1";minus.onclick=()=>changeQty(s,-1);
   const qty=document.createElement("input");qty.className="qtyedit";qty.type="number";qty.inputMode="numeric";qty.min="0";qty.step="1";qty.value=q;
   qty.setAttribute("aria-label",t("qtyCol"));
   qty.addEventListener("change",()=>setQty(s,qty.value));
   qty.addEventListener("blur",()=>setQty(s,qty.value));
   qty.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();qty.blur()}});
   d.append(a,minus,qty);skuList.appendChild(d);
 });
}

function copyCurrentTask(){

 if(!entries.length)return alert(t("noScan"));

   `${t("employeeCol")}：${employeeName.value.trim()||"—"}`,
   `${t("taskCol")}：${taskName.value.trim()||"—"}`,

   `${t("totalCol")}：${total}`,
   "",
   `${t("details")}：`,
   ...entries.map(([sku,qty])=>`${sku}：${qty}`)
 ].join("\n");
 const done=()=>alert(t("copySuccess"));
 if(navigator.clipboard&&window.isSecureContext){
   navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
 }else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
 const area=document.createElement("textarea");
 area.value=text;area.setAttribute("readonly","");
 area.style.position="fixed";area.style.opacity="0";
 document.body.appendChild(area);area.select();
 try{document.execCommand("copy");done()}catch(e){alert(t("copyFailed"))}
 document.body.removeChild(area);
}

function uuid(){
 if(crypto.randomUUID)return crypto.randomUUID();
 return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==="x"?r:(r&3|8);return v.toString(16)});
}

async function uploadTask(task){
 const taskRow={id:task.id,task_date:task.task_date,employee_name:task.employee_name,task_name:task.task_name,task_content:null,batch_no:null,total_qty:task.total_qty,sku_types:task.sku_types,device_id:task.device_id};
 let r=await sb.from("tasks").insert(taskRow);
 if(r.error && r.error.code!=="23505")throw r.error;
 const chunks=[];for(let i=0;i<task.items.length;i+=100)chunks.push(task.items.slice(i,i+100));
 for(const chunk of chunks){
   const rows=chunk.map(x=>({task_id:task.id,sku:x.sku,qty:x.qty}));
   let x=await sb.from("task_items").insert(rows);
   if(x.error){
     for(const row of rows){
       const one=await sb.from("task_items").insert(row);
       if(one.error && one.error.code!=="23505")throw one.error;
     }
   }
 }
 for(const photo of task.order_photos||[]){
   const p=await photoSb.from("task_order_photos").insert({task_id:task.id,user_id:photo.storage_path.split("/")[0],order_no:photo.order_no,storage_path:photo.storage_path,captured_at:photo.captured_at});
   if(p.error&&p.error.code!=="23505")throw p.error;
 }
}
async function retryPending(){
 const arr=pendingTasks();if(!arr.length){updateSyncStatus();return}
 retryBtn.disabled=true;setSync(t("syncing"),"syncwarn");
 const remain=[];
 for(const task of arr){try{await uploadTask(task)}catch(e){remain.push(task)}}
 savePending(remain);retryBtn.disabled=false;
 if(remain.length)setSync(t("syncFailed")+" · "+t("pendingPrefix")+remain.length,"syncerr");else setSync(t("syncReady"),"syncok");
}
async function newTask(){
 if(photoUploadCount)return alert(t("photoWaiting"));
 if(!Object.keys(counts).length)return alert(t("needData"));
 if(!employeeName.value.trim())return alert(t("needEmployee"));
 if(!confirm(t("confirmNew")))return;
 localStorage.setItem("warehouse_employee_name",employeeName.value.trim());
 const task=makeTaskPayload();
 const arr=pendingTasks();arr.push(task);savePending(arr);
 finishBtn.classList.add("busy");retryBtn.style.display="none";setSync(t("syncing"),"syncwarn");
 try{
   await uploadTask(task);
   const left=pendingTasks().filter(x=>x.id!==task.id);savePending(left);
   setSync(t("syncSuccess"),"syncok");
   localStorage.removeItem("warehouse_current_task_photos");
   localStorage.removeItem("warehouse_current_task_id");
   sessionStorage.setItem("warehouse_new_task","1");
   setTimeout(()=>location.reload(),350);
 }catch(e){
   console.error(e);finishBtn.classList.remove("busy");retryBtn.style.display="inline-block";setSync(t("syncFailed"),"syncerr");
 }
}

applyLang();
updatePhotoStatus();
startCamera();
setTimeout(retryPending,800);
</script>
