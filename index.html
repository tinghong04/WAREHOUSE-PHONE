<style>

#setupPage,#infoPage,#scanPage{min-width:0}.page-start{width:100%;font-size:17px;padding:16px}.scan-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.scan-nav b{font-size:16px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#111;border-radius:18px;padding:14px;text-align:center}
.stat span{font-size:12px;color:#999}.stat b{display:block;font-size:30px;margin-top:4px}
.last{font-size:22px;font-weight:800;word-break:break-word}.qty{font-size:18px;font-weight:800;margin-top:8px}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.full{grid-column:1/-1}#copyOrdersBtn{display:none}.mode-order #copyOrdersBtn{display:block}

.mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mode-btn{padding:14px 10px;background:#202024;color:#c8c8cc;border:1px solid #38383d}.mode-btn.active{background:linear-gradient(145deg,#fff,#dcdcdf);color:#111;border-color:#fff}.mode-note{margin-top:10px}.purpose-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.purpose-btn{padding:11px 8px;background:#171719;color:#bbb;border:1px solid #333}.purpose-btn.active{background:#2b7253;color:#fff;border-color:#54b987}.mode-order #excelBtn,.mode-order #copyTaskBtn{display:none}.mode-inbound #taskNameField{display:none}.photo-option{display:none;align-items:center;justify-content:space-between;gap:12px}.inbound-panel{display:none;background:rgba(14,28,20,.94);border:1px solid #2f6548;backdrop-filter:blur(10px)}.camera-wrap .inbound-panel{position:absolute;left:12px;right:12px;bottom:12px;z-index:6;border-radius:15px;padding:11px}.mode-inbound .inbound-panel{display:block}.inbound-actions{position:relative;display:block;min-height:54px;margin-top:11px;text-align:center}.inbound-actions.exception-active{display:flex;align-items:center;justify-content:center;text-align:center}.inbound-actions.exception-active .exception-photo-action.photo-ready{width:174px;min-width:0;margin:0}.inbound-actions.exception-active .resume-inbound{position:absolute;right:0;top:0;width:48px;height:48px;margin:0;padding:0;border-radius:50%;background:linear-gradient(145deg,#38b873,#187541);color:transparent;font-size:0;border-color:#62d99a}.inbound-actions.exception-active .resume-inbound::after{content:"✓";display:block;color:#fff;font-size:25px;font-weight:900;line-height:44px}.inbound-actions button{padding:11px 13px;margin:0 3px}.inbound-actions .icon-action{height:54px;padding:0;border-radius:14px;align-items:center;justify-content:center;font-size:16px}.inbound-actions .camera-icon{display:inline-flex;min-width:148px;background:linear-gradient(145deg,#f8f8f8,#d7d7dc);color:#111}.inbound-actions .cancel-icon{position:absolute;right:0;top:0;width:54px;border-radius:50%;padding:0;background:linear-gradient(145deg,#3b3b40,#1b1b1f);color:#fff;font-size:24px}.inbound-actions .exception-photo-action.photo-ready{display:inline-flex!important;min-width:168px;height:54px;margin:0;padding:0;border-radius:14px;align-items:center;justify-content:center;background:linear-gradient(145deg,#f8f8f8,#d7d7dc);color:#111}.inbound-actions .resume-inbound{position:absolute;right:0;top:0;width:108px;margin:0;padding:15px 7px}.inbound-actions .inbound-start{display:block;width:100%;margin:9px 0 0;background:linear-gradient(145deg,#2f9b65,#17633e);color:#fff}.photo-option b{display:block;font-size:15px}.photo-option .muted{margin-top:3px}.switch{position:relative;width:52px;height:30px;flex:none}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#343438;border:1px solid #505055;border-radius:999px;transition:.2s}.slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,.35);transition:.2s}.switch input:checked + .slider{background:#1d8d58;border-color:#42b97e}.switch input:checked + .slider:before{transform:translateX(22px)}.photo-controls{position:absolute;left:12px;right:12px;bottom:12px;z-index:5;display:none;padding:11px;background:rgba(10,10,10,.88);border:1px solid rgba(255,255,255,.18);border-radius:15px;backdrop-filter:blur(10px)}.photo-status{margin-bottom:8px;font-size:12px;color:#ddd}.photo-status.ok{color:#83f6b0}.photo-status.err{color:#ffadad}.photo-action{width:100%;background:linear-gradient(145deg,#2f9b65,#17633e);color:#fff;border-color:#52bb82}.syncbar b{font-size:13px}.syncbar span{font-size:12px;color:#aaa}.syncok{color:#7dff9d!important}.syncwarn{color:#ffd27d!important}.syncerr{color:#ff9f9f!important}.busy{opacity:.55;pointer-events:none}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid #262626}.boxedit{width:84px;padding:8px 7px;font-size:13px;text-align:center;border:1px solid #387756;background:#14261b;color:#d8ffe6;border-radius:9px}.boxedit::placeholder{color:#95bda4;font-size:11px}.scan-qty-controls{position:absolute;left:12px;right:12px;top:12px;z-index:7;display:flex;gap:7px;align-items:center;padding:8px;background:rgba(10,10,10,.82);border:1px solid rgba(255,255,255,.16);border-radius:12px}.mode-order .scan-qty-controls{display:none}.mode-order #boxModeBtn{display:none}.mode-inbound #countExceptionBtn{display:none}.scan-qty-label{font-size:12px;color:#ddd;margin-right:auto}.scan-qty-btn{padding:7px 10px;background:#252528;color:#ddd}.scan-qty-btn.active{background:#f2f2f2;color:#111}.scan-step-action{margin:0 0 12px}.scan-step-action button{width:100%;background:linear-gradient(145deg,#2f9b65,#17633e);color:#fff}.reviewing .camera-card,.reviewing .scan-hint,.reviewing .scan-only,.reviewing .scan-step-action{display:none!important}.review-title{display:flex;align-items:center;justify-content:space-between;gap:8px}.review-title b{font-size:17px}
.workflow-steps{display:none;grid-template-columns:repeat(5,1fr);gap:5px;margin:0 0 12px}.workflow-steps span{text-align:center;padding:8px 3px;border-radius:9px;background:#171719;border:1px solid #29292d;color:#747477;font-size:11px;font-weight:800}.workflow-steps span.active{background:#e9f9ef;color:#153d26;border-color:#d7f5e2}.workflow-steps span.done{background:#203629;color:#a7e6bd;border-color:#2f6643}#scanPage[data-stage="inbound-batch"] .photo-option,#scanPage[data-stage="inbound-batch"] .scan-qty-controls,#scanPage[data-stage="inbound-batch"] .scan-hint,#scanPage[data-stage="inbound-batch"] .scan-step-action,#scanPage[data-stage="inbound-batch"] .scan-only,#scanPage[data-stage="inbound-photo"] .photo-option,#scanPage[data-stage="inbound-photo"] .scan-qty-controls,#scanPage[data-stage="inbound-photo"] .scan-hint,#scanPage[data-stage="inbound-photo"] .scan-step-action,#scanPage[data-stage="inbound-photo"] .scan-only,#scanPage[data-stage="inbound-ready"] .photo-option,#scanPage[data-stage="inbound-ready"] .scan-qty-controls,#scanPage[data-stage="inbound-ready"] .scan-hint,#scanPage[data-stage="inbound-ready"] .scan-step-action,#scanPage[data-stage="inbound-ready"] .scan-only{display:none!important}#scanPage[data-stage="inbound-photo"] .scan-overlay,#scanPage[data-stage="inbound-ready"] .scan-overlay{display:none!important}
.pill{background:#222;border-radius:999px;padding:6px 9px;font-weight:800}.mini{padding:7px 10px;border-radius:9px;background:#222;color:#fff}.qtyedit{width:84px!important;text-align:center;font-weight:900;padding:8px 7px!important;border-radius:11px!important;background:#1c1c1e!important}
.search{margin-top:10px}

.flash.on{opacity:1}
#restartBtn{display:none;margin:10px auto 0}

html,body{height:100%;overflow:hidden}html{scroll-behavior:smooth}
.wrap{height:100dvh;overflow:hidden;padding:12px 12px 86px}
#setupPage,#infoPage,#scanPage{height:100%;min-height:0;overflow:hidden}
#scanPage.reviewing{overflow-y:auto;overscroll-behavior:contain;padding-bottom:16px}
#scanPage:not(.reviewing){display:flex;flex-direction:column}
#scanPage:not(.reviewing) .camera-card{flex:1;min-height:0;display:flex;flex-direction:column}
#scanPage:not(.reviewing) .camera-wrap,#scanPage:not(.reviewing) #reader{flex:1;min-height:0;height:100%}
#scanPage:not(.reviewing) #reader video{height:100%!important;object-fit:cover}
body[data-view="mode"] #infoPage,body[data-view="mode"] #scanPage{display:none!important}
body[data-view="info"] #setupPage,body[data-view="info"] #scanPage{display:none!important}
body[data-view="camera"] #setupPage,body[data-view="camera"] #infoPage,body[data-view="camera"] #reviewArea{display:none!important}
body[data-view="data"] #setupPage,body[data-view="data"] #infoPage,body[data-view="data"] .camera-card,body[data-view="data"] .scan-hint,body[data-view="data"] .scan-only,body[data-view="data"] .scan-step-action{display:none!important}
@media(max-height:650px){.wrap{padding:7px 9px 78px}.bottom-tabs{bottom:max(5px,env(safe-area-inset-bottom))}}
button,.card,.stat,input,textarea{
  -webkit-tap-highlight-color:transparent;
}
button{
  transition:transform .10s ease,opacity .10s ease;
  will-change:transform;
}
button:hover{filter:brightness(1.08);box-shadow:0 7px 18px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.22)}
button:active{transform:scale(.97);filter:brightness(.94);box-shadow:0 2px 7px rgba(0,0,0,.28)}
.card,.stat{
  transform:translateZ(0);
  backface-visibility:hidden;
}
.flash{
  will-change:opacity;
  transform:translateZ(0);
}
.row{
  contain:layout paint;
}

#scanPage:not(.reviewing) .syncbar,#scanPage:not(.reviewing) .scan-hint,#scanPage:not(.reviewing) .scan-only,#scanPage:not(.reviewing) .scan-step-action{display:none!important}
#scanPage:not(.reviewing) .camera-card{margin-top:0;padding:0;overflow:hidden;border-radius:18px}
#scanPage:not(.reviewing) .camera-status{padding:9px 12px}
#scanPage:not(.reviewing) .scan-step-action{position:sticky;bottom:10px;z-index:20;margin:12px 0 0;padding:0 2px}
#scanPage:not(.reviewing) .scan-step-action button{min-height:52px;font-size:16px;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.app-page{min-height:0;display:block}.app-page.hidden{display:none!important}.page-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;min-height:46px}.page-top b{font-size:17px}.page-footer{margin-top:auto;padding-top:12px}.mode-card{margin:0 0 12px}.mode-btn{min-height:116px;font-size:17px;line-height:1.8}.mode-btn:first-letter{font-size:26px}.mode-note{min-height:38px}.app-page:not(#scanPage) .card{margin-bottom:12px}@media(max-height:720px){.app-page{min-height:calc(100dvh - 28px)}.header{padding:12px}.mode-btn{min-height:88px;padding:9px}.mode-note{min-height:24px}.page-start{padding:13px}.grid{gap:7px}input{padding:10px}}
.bottom-tabs{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;width:min(720px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:7px;background:rgba(20,20,22,.94);border:1px solid rgba(255,255,255,.13);border-radius:18px;box-shadow:0 14px 35px rgba(0,0,0,.5);backdrop-filter:blur(18px)}.bottom-tabs button{padding:7px 4px;background:transparent;color:#999;border:0;box-shadow:none;font-size:11px;line-height:1.25}.bottom-tabs button span{display:block;font-size:19px;margin-bottom:2px}.bottom-tabs button.active{background:#f3f3f5;color:#121214;border-radius:12px}.wrap{padding-bottom:98px}

<body>
<div class="flash" id="flash"></div>
<div class="wrap">
  <div id="setupPage" class="app-page">
  <div class="card header">
    <button class="langbtn" id="langBtn" onclick="toggleLang()">EN</button>
    <h1 data-ui="appName">仓库助手</h1>
    <div class="muted" data-ui="chooseMode">选择本次工作方式</div>
  </div>
  <div class="card mode-card"><div class="mode-switch"><button id="countModeBtn" class="mode-btn" onclick="setMode('count')">📦<br><span data-ui="countMode">点货模式</span></button><button id="orderModeBtn" class="mode-btn" onclick="setMode('order')">📷<br><span data-ui="orderMode">扫单模式</span></button></div><div id="countPurposeCard" class="purpose-switch"><button id="inventoryPurposeBtn" class="purpose-btn" onclick="setCountPurpose('inventory')" data-ui="inventory">库存盘点</button><button id="inboundPurposeBtn" class="purpose-btn" onclick="setCountPurpose('inbound')" data-ui="inboundChoice">货物入库</button></div><div id="modeNote" class="muted mode-note"></div></div>
</div>

<div id="infoPage" class="hidden app-page">
  <div class="page-top"><button class="dark" onclick="backToModePage()" data-ui="chooseModeBack">← 选择模式</button><b data-ui="taskDetails">任务资料</b><span></span></div>
  <div class="card">
    <div class="grid">
      <div><label data-i18n="employee">员工姓名</label><input id="employeeName" data-ph="employeePh" placeholder="例如：Ah Hong"></div>
      <div><label data-ui="customer">客户</label><input id="customerName" data-ui-ph="customerPh" placeholder="例如：ABC Trading"></div>
      <div><label data-i18n="date">日期</label><input id="taskDate" type="date" disabled></div>
      <div id="taskNameField"><label data-i18n="taskName">任务名称</label><input id="taskName" data-ph="taskNamePh" placeholder="例如：退货盘点"></div>
    </div>
  </div>
  <div id="photoSetupCard" class="card photo-option">
    <div><b data-i18n="photoMode">每单拍照</b><div class="muted" data-ui="photoHint">扫完一单后，确认画面再拍照</div></div>
    <label class="switch" aria-label="每单拍照"><input id="photoMode" type="checkbox"><span class="slider"></span></label>
  </div>
  <button class="dark page-start" type="button" onclick="resetCurrentTask()" data-ui="reset">↺ 重置本次任务</button>
</div>

<div id="scanPage" class="hidden">
  <div class="scan-nav"><button class="dark" onclick="backToSetup()" data-ui="taskInfo">← 任务资料</button><b id="scanStepTitle">相机</b><span></span></div>
  <div class="syncbar"><div><b id="syncTitle">☁️ 云端同步</b><br><span id="syncStatus">准备中…</span></div><button id="retryBtn" class="dark" style="padding:9px 12px;display:none" onclick="retryPending()">重试</button></div>

  <div class="card camera-card">
    <div class="camera-wrap">
      <div id="reader"></div>
      <div id="manualEntryPanel" class="manual-entry-panel hidden">
        <b data-ui="manualTitle">手动录入</b>
        <input id="manualInput" inputmode="text" autocomplete="off" data-ui-ph="manualSku" placeholder="输入 SKU / 单号">
        <input id="manualQty" type="number" min="1" step="1" inputmode="numeric" value="1" data-ui-ph="manualQty" placeholder="数量">
        <button type="button" onclick="manualAdd()" data-ui="manualAdd">加入记录</button>
        <button class="dark" type="button" onclick="toggleManualMode(false)" data-ui="backScan">← 返回扫码</button>
      </div>
      <div class="scan-overlay">
        <div class="scan-box">
          <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
        </div>
      </div>
      <div id="photoControls" class="photo-controls">
        <div id="photoStatus" class="photo-status"></div>
        <button id="capturePhotoBtn" class="photo-action" onclick="capturePendingOrderPhoto()" data-i18n="photoAction">📷 确认画面清楚，拍照并记录</button>
      </div>
      <div id="scanQuantityControls" class="scan-qty-controls"><button id="boxModeBtn" class="scan-qty-btn box-mode-btn" onclick="setCountingUnit('box')" data-ui="byBox">📦 按箱</button><span class="scan-qty-label" data-ui="scanOnce">每扫一次</span><button id="scanQty1" class="scan-qty-btn" onclick="setScanIncrement(1)">+1</button><button id="scanQty5" class="scan-qty-btn" onclick="setScanIncrement(5)">+5</button><button id="scanQty10" class="scan-qty-btn" onclick="setScanIncrement(10)">+10</button><button id="countExceptionBtn" class="scan-qty-btn" onclick="captureCountException()" data-ui="exception">异常</button><button id="countExceptionDoneBtn" class="scan-qty-btn" style="display:none" onclick="finishCountException()" data-ui="complete">完成</button></div>

function unlockAudio(){
 try{
   if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
   if(audioCtx.state==="suspended")audioCtx.resume();
 }catch(e){}
}
["touchstart","pointerdown","click"].forEach(evt=>document.addEventListener(evt,unlockAudio,{passive:true}));

function shutter(){
 try{
   if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
   const play=()=>{
     const now=audioCtx.currentTime;
     [[1850,0],[1250,.055]].forEach(([hz,delay])=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="square";o.frequency.setValueAtTime(hz,now+delay);g.gain.setValueAtTime(.0001,now+delay);g.gain.exponentialRampToValueAtTime(.12,now+delay+.006);g.gain.exponentialRampToValueAtTime(.0001,now+delay+.045);o.connect(g);g.connect(audioCtx.destination);o.start(now+delay);o.stop(now+delay+.06);});
   };
   if(audioCtx.state==="suspended"){audioCtx.resume().then(play).catch(()=>{})}else play();
 }catch(e){}
}
function beep(){
 try{
   unlockAudio();
   if(!audioCtx || audioCtx.state!=="running")return;
   const now=audioCtx.currentTime;
   const o=audioCtx.createOscillator(),g=audioCtx.createGain();
   o.type="square";o.frequency.setValueAtTime(1350,now);
   g.gain.setValueAtTime(0.0001,now);
   g.gain.exponentialRampToValueAtTime(0.34,now+0.005);
   g.gain.exponentialRampToValueAtTime(0.0001,now+0.14);
   o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+0.15);
 }catch(e){}
}
function feedback(){
 beep();
 // iPhone Safari does not support navigator.vibrate; Android/compatible browsers will vibrate.
 try{if(navigator.vibrate)navigator.vibrate(80)}catch(e){}
 requestAnimationFrame(()=>{
   flash.classList.add("on");
   setTimeout(()=>requestAnimationFrame(()=>flash.classList.remove("on")),120);
 });
}

function add(code,qty=1){
 code=(code||"").trim();qty=Math.max(1,parseInt(qty,10)||1);if(!code)return;
 counts[code]=(counts[code]||0)+qty;
 for(let i=0;i<qty;i++)history.push(code);
 lastCode.textContent=code;lastQty.textContent=t("currentQty")+counts[code];
 feedback();scheduleRender();
}

function onScan(code){
 const now=Date.now();
 if(photoPendingCode||exceptionPhotoArmed||countExceptionArmed||now<scanLockedUntil)return;
 if(currentMode==="count"&&countPurpose==="inbound"){
   if(!inboundBatchNo){inboundBatchNo=code;localStorage.setItem("warehouse_inbound_batch_no",code);lastDecoded=code;lastAt=now;lastCode.textContent="批次："+code;lastQty.textContent="请拍本批次货物";feedback();updateInboundUI();syncWorkflowStage();setTimeout(()=>restartCamera(),0);return}
   if(!inboundCountingStarted)return;
 }
 const minInterval=currentMode==="count"?400:900;
 const sameCodeInterval=currentMode==="count"?1000:2000;
 if(now-lastAt<minInterval)return;
 if(code===lastDecoded&&now-lastAt<sameCodeInterval)return;
 lastDecoded=code;lastAt=now;
 const addQty=currentMode==="count"?getCountScanQuantity(code):1;
 if(!addQty)return;
 add(code,addQty);
 if(photoMode.checked){
   photoPendingCode=code;
   cameraCard.classList.add("photo-capture-mode");
   photoControls.style.display="block";
   updatePhotoStatus("ready");
 }
}

async function enhanceCamera(){
 try{
   const video=document.querySelector("#reader video");
   if(!video || !video.srcObject)return;
   currentTrack=video.srcObject.getVideoTracks()[0];
   const caps=currentTrack.getCapabilities?currentTrack.getCapabilities():{};
   const advanced={};
   if(caps.focusMode && caps.focusMode.includes("continuous"))advanced.focusMode="continuous";

function captureOrderPhoto(orderNo){
 photoUploadCount++;updatePhotoStatus("taking");
 return new Promise(resolve=>{
   const video=document.querySelector("#reader video");
   if(!video||!video.videoWidth){photoUploadCount--;updatePhotoStatus("error");resolve(false);return}
   const max=1080,scale=Math.min(1,max/Math.max(video.videoWidth,video.videoHeight));
   const canvas=document.createElement("canvas");canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);
   shutter();try{if(navigator.vibrate)navigator.vibrate(35)}catch(e){}
   canvas.getContext("2d").drawImage(video,0,0,canvas.width,canvas.height);
   canvas.toBlob(async blob=>{
     let saved=false;
     try{
       if(!blob)throw new Error("No photo data");
       const userId=await ensurePhotoUser();
       const fileName=`${Date.now()}_photo.jpg`;
       const path=`${userId}/${currentTaskId}/${fileName}`;
       const uploaded=await photoSb.storage.from("task-order-photos").upload(path,blob,{contentType:"image/jpeg",cacheControl:"31536000",upsert:false});
       if(uploaded.error)throw uploaded.error;
       orderPhotos.push({order_no:orderNo,storage_path:path,captured_at:new Date().toISOString()});

       updatePhotoStatus();saved=true;
     }catch(e){console.error(e);photoLastError=e?.message||"照片服务连接失败";updatePhotoStatus("error")}
     finally{photoUploadCount--;resolve(saved)}
   }, "image/jpeg", .92);
 });
}

function undoLast(){

 counts[c]--;if(counts[c]<=0)delete counts[c];

function changeQty(sku,delta){
 if(!counts[sku])return;counts[sku]+=delta;
 if(counts[sku]<=0)delete counts[sku];
 if(delta>0)history.push(sku);else{const idx=history.lastIndexOf(sku);if(idx>=0)history.splice(idx,1)}
 lastCode.textContent=sku;lastQty.textContent=t("currentQty")+(counts[sku]||0);scheduleRender();
}
function setQty(sku,value){
 const old=counts[sku]||0;
 const next=Math.max(0,parseInt(value,10)||0);
 if(next===old){scheduleRender();return}
 if(next<=0){
   delete counts[sku];
   history=history.filter(x=>x!==sku);
 }else{
   counts[sku]=next;
   const diff=next-old;
   if(diff>0){
     for(let i=0;i<diff;i++)history.push(sku);
   }else{
     let remove=-diff;
     for(let i=history.length-1;i>=0&&remove>0;i--){
       if(history[i]===sku){history.splice(i,1);remove--}
     }
   }
 }
 lastCode.textContent=sku;lastQty.textContent=t("currentQty")+(counts[sku]||0);scheduleRender();
}

   "",
   `${t("details")}：`,
   ...entries.map(([sku,qty])=>`${sku}：${qty}`)
 ].join("\n");
 const done=()=>alert(t("copySuccess"));
 if(navigator.clipboard&&window.isSecureContext){
   navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
 }else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
 const area=document.createElement("textarea");
 area.value=text;area.setAttribute("readonly","");
 area.style.position="fixed";area.style.opacity="0";
 document.body.appendChild(area);area.select();
 try{document.execCommand("copy");done()}catch(e){alert(t("copyFailed"))}
 document.body.removeChild(area);
}

function uuid(){
 if(crypto.randomUUID)return crypto.randomUUID();
 return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==="x"?r:(r&3|8);return v.toString(16)});
}
function deviceId(){
 let id=localStorage.getItem("warehouse_device_id");
 if(!id){id=uuid();localStorage.setItem("warehouse_device_id",id)}
 return id;
}
function pendingTasks(){
 try{return JSON.parse(localStorage.getItem("warehouse_pending_tasks")||"[]")}catch(e){return []}
}
function savePending(arr){localStorage.setItem("warehouse_pending_tasks",JSON.stringify(arr));updateSyncStatus()}
function makeTaskPayload(){
 const entries=Object.entries(counts);
 return {
   id:uuid(),
   task_date:taskDate.value,employee_name:employeeName.value.trim(),customer_name:customerName.value.trim()||null,task_name:(currentMode==="count"&&countPurpose==="inbound"?"":taskName.value.trim()),task_content:(currentMode==="count"&&countPurpose==="inbound"?"inbound":currentMode),batch_no:(currentMode==="count"&&countPurpose==="inbound"?inboundBatchNo:null),
   total_qty:entries.reduce((s,x)=>s+x[1],0),sku_types:entries.length,device_id:deviceId(),
   items:entries.map(([sku,qty])=>({sku,qty})),
   order_photos:orderPhotos.slice()
 };
}
function setSync(text,cls){syncStatus.textContent=text;syncStatus.className=cls||""}
function updateSyncStatus(){
 if(!syncStatus)return;
 const n=pendingTasks().length;
 if(n){setSync(t("pendingPrefix")+n,"syncwarn");retryBtn.style.display="inline-block"}
 else{setSync(t("syncReady"),"syncok");retryBtn.style.display="none"}
}
async function uploadTask(task){
 const taskRow={id:task.id,task_date:task.task_date,employee_name:task.employee_name,customer_name:task.customer_name||null,task_name:task.task_name,task_content:task.task_content||null,batch_no:task.batch_no||null,total_qty:task.total_qty,sku_types:task.sku_types,device_id:task.device_id};
 let r=await sb.from("tasks").insert(taskRow);
 if(r.error && r.error.code!=="23505")throw r.error;
 const chunks=[];for(let i=0;i<task.items.length;i+=100)chunks.push(task.items.slice(i,i+100));
 for(const chunk of chunks){
   const rows=chunk.map(x=>({task_id:task.id,sku:x.sku,qty:x.qty}));
   let x=await sb.from("task_items").insert(rows);
   if(x.error){
     for(const row of rows){
       const one=await sb.from("task_items").insert(row);
       if(one.error && one.error.code!=="23505")throw one.error;
     }
   }
 }
 for(const photo of task.order_photos||[]){
   const p=await photoSb.from("task_order_photos").insert({task_id:task.id,user_id:photo.storage_path.split("/")[0],order_no:photo.order_no,storage_path:photo.storage_path,captured_at:photo.captured_at});
   if(p.error&&p.error.code!=="23505")throw p.error;
 }
}
async function retryPending(){
 const arr=pendingTasks();if(!arr.length){updateSyncStatus();return}
 retryBtn.disabled=true;setSync(t("syncing"),"syncwarn");
 const remain=[];
 for(const task of arr){try{await uploadTask(task)}catch(e){remain.push(task)}}
 savePending(remain);retryBtn.disabled=false;
 if(remain.length)setSync(t("syncFailed")+" · "+t("pendingPrefix")+remain.length,"syncerr");else setSync(t("syncReady"),"syncok");
}
async function newTask(){
 if(photoUploadCount)return alert(t("photoWaiting"));
 if(!Object.keys(counts).length)return alert(t("needData"));
 if(!employeeName.value.trim())return alert(t("needEmployee"));
 if(!confirm(t("confirmNew")))return;
 localStorage.setItem("warehouse_employee_name",employeeName.value.trim());
 localStorage.setItem("warehouse_customer_name",customerName.value.trim());
 const task=makeTaskPayload();
 const arr=pendingTasks();arr.push(task);savePending(arr);
 finishBtn.classList.add("busy");retryBtn.style.display="none";setSync(t("syncing"),"syncwarn");
 try{
   await uploadTask(task);
   const left=pendingTasks().filter(x=>x.id!==task.id);savePending(left);
   setSync(t("syncSuccess"),"syncok");
   localStorage.removeItem("warehouse_current_task_photos");localStorage.removeItem("warehouse_current_box_sizes");
   localStorage.removeItem("warehouse_current_task_id");localStorage.removeItem("warehouse_inbound_counting");localStorage.removeItem("warehouse_inbound_batch_no");localStorage.removeItem("warehouse_inbound_batch_photo");
   sessionStorage.setItem("warehouse_new_task","1");
   setTimeout(()=>location.reload(),350);
 }catch(e){
   console.error(e);finishBtn.classList.remove("busy");retryBtn.style.display="inline-block";setSync(t("syncFailed"),"syncerr");
 }
}

setActiveTab("mode");
applyLang();
applyMode();
setScanIncrement(scanIncrement);
setCountingUnit(countByBox?"box":"piece");
updatePhotoStatus();
setTimeout(retryPending,800);
</script>
</body>
